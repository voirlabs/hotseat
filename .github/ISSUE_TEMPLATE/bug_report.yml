name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open /room/seed-skeptic
        2. Start a call
        3. ...
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser, OS and models
      placeholder: Chrome 140 on macOS, gpt-5.4-mini
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Browser console or server output. Remove any API keys.
      render: text
