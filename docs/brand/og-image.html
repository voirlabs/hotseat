<!doctype html>
<!-- Source for site/og.png and app/opengraph-image.png (1200x630). From the repo root:
     google-chrome --headless=new --hide-scrollbars --virtual-time-budget=4000 --window-size=1200,630 \
       --screenshot="$PWD/site/og.png" "file://$PWD/docs/brand/og-image.html"
     cp site/og.png app/opengraph-image.png -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;600&display=swap">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{position:relative;background:#080809;color:#f3f1ed;font:500 16px Urbanist,sans-serif}
.c{position:absolute;inset:68px 80px 60px;display:flex;flex-direction:column;width:680px}
.lock{display:flex;align-items:center;gap:20px;font-size:46px;letter-spacing:-.04em;line-height:1}
.lock img{width:52px;height:52px}
h1{font:400 76px/1.04 Georgia,"Times New Roman",serif;letter-spacing:-.035em;margin:54px 0 0}
h1 em{color:#d0a2ff}
p{font-size:26px;line-height:1.4;color:#b3acbc;margin:24px 0 0}
.by{margin-top:auto;display:flex;align-items:center;gap:12px;font-size:21px;color:#b3acbc}
.by img{width:30px;height:20px;filter:brightness(1.4)}
.art{position:absolute;right:56px;top:50%;width:400px;height:400px;transform:translateY(-50%);object-fit:contain;filter:drop-shadow(0 26px 46px #000000a0)}
</style></head><body>
<img class="art" id="art" alt="">
<div class="c"><div class="lock"><img id="mark" alt=""><span id="name"></span></div><h1 id="h"></h1><p id="s"></p>
<div class="by"><img src="../../site/assets/voir-mark.svg" alt="">by Voir Labs</div></div>
<script>
document.getElementById("art").src="../../site/assets/hero.webp";document.getElementById("mark").src="../../public/logo.svg";
document.getElementById("name").textContent="hotseat";
document.getElementById("h").innerHTML="Get grilled<br>before it <em>counts.</em>";
document.getElementById("s").textContent="Practice investor pitches and sales calls out loud with AI personas who push back.";
</script></body></html>
